version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - monitoring-net

  price-monitor:
    build: .
    container_name: price-monitor
    depends_on:
      - rabbitmq
    networks:
      - monitoring-net
    environment:
      - RABBITMQ_URL=amqp://rabbitmq

networks:
  monitoring-net:
    driver: bridge
